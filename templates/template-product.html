<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link href="https://fonts.googleapis.com/css?family=Megrim|Nunito+Sans:400,900" rel="stylesheet" />
    <link
      rel="icon"
      href="https://emojipedia-us.s3.dualstack.us-west-1.amazonaws.com/thumbs/240/apple/155/ear-of-maize_1f33d.png"
    />

    <title>{%PRODUCTNAME%} {%IMAGE%} /// NODE FARM</title>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
      }

      html {
        box-sizing: border-box;
      }

      body {
        padding: 3.125rem 3.125rem 6.25rem;
        line-height: 1.7;
        font-family: "Nunito Sans", sans-serif;
        color: #555;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #9be15d, #00e3ae);
      }

      h1 {
        font-family: "Megrim", sans-serif;
        font-size: 3.75rem;
        color: #173f24;
        transform: skewY(-5deg);
        text-align: center;
        position: relative;
        word-spacing: 3px;
        line-height: 1.15;
      }

      h1::before {
        content: "";
        display: block;
        height: 65%;
        width: 49%;
        position: absolute;
        top: 105%;
        left: 50%;
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        opacity: 0.8;
        z-index: -1;
        transform: skewY(370deg) translate(-50%, -50%);
      }

      .container {
        width: min(100%, 59.375rem);
        margin: 0 auto;
      }

      .product {
        width: min(100%, 37.5rem);
        margin: 0 auto;
        margin-top: 5.625rem;
        background: white;
        box-shadow: 0 1.875rem 3.75rem 0.625rem rgba(0, 0, 0, 0.2);
        position: relative;
      }

      .product__hero {
        position: relative;
        height: 13.75rem;
        overflow: hidden;
      }

      .product__hero::before {
        content: "";
        display: block;
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-image: linear-gradient(to left bottom, #9be15d, #00e3ae);
        opacity: 0.5;
        z-index: 100;
      }

      .product__emoji {
        font-size: 9.375rem;
        position: absolute;
      }

      .product__emoji--1 {
        top: -2.5rem;
        left: -1.25rem;
        z-index: 10;
      }

      .product__emoji--2 {
        top: -3.75rem;
        left: 5.625rem;
      }

      .product__emoji--3 {
        top: -2.5rem;
        right: 9.375rem;
      }

      .product__emoji--4 {
        top: -3.125rem;
        right: 1.25rem;
        z-index: 10;
      }

      .product__emoji--5 {
        bottom: -5.625rem;
        left: 11.25rem;
      }

      .product__emoji--6 {
        bottom: -5rem;
        left: 3.125rem;
      }

      .product__emoji--7 {
        bottom: -7.5rem;
        right: 8.75rem;
      }

      .product__emoji--8 {
        bottom: -5rem;
        right: -1.25rem;
      }

      .product__emoji--9 {
        top: -4.375rem;
        left: 11.875rem;
      }

      .product__organic {
        position: absolute;
        top: -2.5rem;
        right: -2.5rem;
        z-index: 1000;
        height: 6.875rem;
        width: 6.875rem;
        background-image: linear-gradient(to bottom, #9be15d, #00e3ae);
        border-radius: 50%;
        transform: rotate(15deg);
        box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .product__organic h5 {
        font-weight: 900;
        text-transform: uppercase;
        font-size: 1.125rem;
        color: #173f24;
      }

      .product__back:link,
      .product__back:visited {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        font-size: 0.9375rem;
        font-weight: 700;
        text-transform: uppercase;
        text-decoration: none;
        z-index: 1000;
        color: #555;
        background-color: white;
        box-shadow: 0 0.625rem 1.875rem rgba(0, 0, 0, 0.3);
        border-radius: 100rem;
        padding: 0 1.25rem;
        min-height: 2.75rem;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
      }

      .product__back:hover,
      .product__back:active {
        background-color: #e0f2df;
      }

      .product__name {
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        padding: 0.625rem;
        font-family: "Megrim", sans-serif;
        font-size: 2.5rem;
        line-height: 1.15;
        color: #173f24;
        text-align: center;
        word-spacing: 2px;
      }

      .product__details {
        background-color: #eee;
        padding: 2.5rem 3.75rem;
        font-size: 1.1875rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9375rem;
      }

      .product__description {
        padding: 3.125rem 3.75rem;
        font-size: 1rem;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }

      .product__link:link,
      .product__link:visited {
        display: block;
        background-color: #287a3b;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.9375rem;
        min-height: 3.5rem;
        text-align: center;
        box-shadow: 0 1.25rem 3.75rem rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s;
      }

      .product__link:hover,
      .product__link:active {
        background-color: #1f6530;
      }

      .product__link span {
        transform: skewX(20deg);
      }

      .emoji-left {
        font-size: 1.25rem;
        margin-right: 0.625rem;
      }

      .emoji-right {
        font-size: 1.25rem;
        margin-left: 0.625rem;
      }

      .not-organic {
        display: none;
      }

      .product__back:focus-visible,
      .product__link:focus-visible {
        outline: 0.1875rem solid #173f24;
        outline-offset: 0.1875rem;
      }

      @media (max-width: 40rem) {
        body {
          padding: 1.5rem 1rem 3rem;
        }

        h1 {
          font-size: 2.5rem;
        }

        .product {
          margin-top: 3.75rem;
        }

        .product__hero {
          height: 11.25rem;
        }

        .product__emoji {
          font-size: 6.25rem;
        }

        .product__emoji--1 {
          top: -1.875rem;
          left: -1rem;
        }
        .product__emoji--2 {
          top: -2.5rem;
          left: 3.125rem;
        }
        .product__emoji--3 {
          top: -1.875rem;
          right: 4rem;
        }
        .product__emoji--4 {
          top: -2.5rem;
          right: -0.75rem;
        }
        .product__emoji--5 {
          bottom: -4.375rem;
          left: 6rem;
        }
        .product__emoji--6 {
          bottom: -3.75rem;
          left: 1rem;
        }
        .product__emoji--7 {
          bottom: -5rem;
          right: 3.5rem;
        }
        .product__emoji--8 {
          bottom: -3.75rem;
          right: -1.25rem;
        }
        .product__emoji--9 {
          top: -2.5rem;
          left: 6.25rem;
        }

        .product__organic {
          top: -1.5rem;
          right: -0.375rem;
          width: 5.25rem;
          height: 5.25rem;
        }

        .product__organic h5 {
          font-size: 0.875rem;
        }

        .product__back:link,
        .product__back:visited {
          top: 0.75rem;
          left: 0.75rem;
          min-height: 2.5rem;
          padding: 0 0.75rem;
          font-size: 0.8125rem;
        }

        .product__name {
          padding: 0.75rem;
          font-size: 1.75rem;
          overflow-wrap: anywhere;
        }

        .product__details {
          grid-template-columns: minmax(0, 1fr);
          gap: 0.5rem;
          padding: 1.25rem 1.5rem;
          font-size: 1rem;
        }

        .product__description {
          padding: 1.5rem;
          font-size: 1rem;
        }

        .product__link:link,
        .product__link:visited {
          padding: 0.75rem;
          font-size: 0.875rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🌽 Node Farm 🥦</h1>

      <figure class="product">
        <div class="product__organic {%NOT_ORGANIC%}"><h5>Organic</h5></div>
        <a href="/overview" class="product__back"> <span class="emoji-left">👈</span>Back </a>
        <div class="product__hero">
          <span class="product__emoji product__emoji--1">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--2">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--3">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--4">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--5">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--6">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--7">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--8">{%IMAGE%}</span>
          <span class="product__emoji product__emoji--9">{%IMAGE%}</span>
        </div>
        <h2 class="product__name">{%PRODUCTNAME%}</h2>
        <div class="product__details">
          <p><span class="emoji-left">🌍</span>From {%FROM%}</p>
          <p><span class="emoji-left">❤️</span>{%NUTRIENTS%}</p>
          <p><span class="emoji-left">📦</span>{%QUANTITY%}</p>
          <p><span class="emoji-left">🏷</span>{%PRICE%}€</p>
        </div>

        <a href="#" class="product__link">
          <span class="emoji-left">🛒</span>
          <span>Add to shopping card ({%PRICE%}€)</span>
        </a>

        <p class="product__description">{%DESCRIPTION%}</p>
      </figure>
    </div>
  </body>
</html>
