<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link href="https://fonts.googleapis.com/css?family=Megrim|Nunito+Sans:400,900" rel="stylesheet" />
    <link
      rel="icon"
      href="https://emojipedia-us.s3.dualstack.us-west-1.amazonaws.com/thumbs/240/apple/155/ear-of-maize_1f33d.png"
    />

    <title>NODE FARM</title>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
      }

      html {
        box-sizing: border-box;
      }

      body {
        padding: 3.125rem 3.125rem 6.25rem;
        line-height: 1.7;
        font-family: "Nunito Sans", sans-serif;
        color: #555;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #9be15d, #00e3ae);
      }

      h1 {
        font-family: "Megrim", sans-serif;
        font-size: 3.75rem;
        color: #173f24;
        transform: skewY(-5deg);
        text-align: center;
        position: relative;
        word-spacing: 3px;
        line-height: 1.15;
      }

      h1::before {
        content: "";
        display: block;
        height: 65%;
        width: 49%;
        position: absolute;
        top: 105%;
        left: 50%;
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        opacity: 0.8;
        z-index: -1;
        transform: skewY(370deg) translate(-50%, -50%);
      }

      .container {
        width: min(100%, 59.375rem);
        margin: 0 auto;
      }

      .cards-container {
        margin-top: 5rem;
      }

      .card {
        background: white;
        box-shadow: 0 1.25rem 3.75rem 0.625rem rgba(0, 0, 0, 0.15);
        margin-bottom: 3.125rem;
        transform: skewX(-20deg);
        display: flex;
        align-items: stretch;
        min-width: 0;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }

      .card__emoji {
        flex: 0 0 auto;
        font-size: 3.4375rem;
        line-height: 1.2;
        padding: 0.9375rem 3.75rem 0.3125rem 0.9375rem;
        letter-spacing: -2.5rem;
        transform: skewX(20deg);
      }

      .card__title-box {
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        margin-right: auto;
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 0 1.875rem;
      }

      .card__title {
        font-family: "Megrim", sans-serif;
        color: #173f24;
        font-size: 2.03125rem;
        line-height: 1.15;
        overflow-wrap: anywhere;
        transform: skewX(20deg);
      }

      .card__details {
        display: flex;
        flex: 0 1 auto;
        min-width: 0;
      }

      .card__detail-box {
        align-self: stretch;
        border-right: 1px solid #ddd;
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .card__detail-box:last-child {
        border: none;
      }

      .card__detail {
        font-weight: 400;
        font-size: 1.125rem;
        line-height: 1.35;
        transform: skewX(20deg);
        padding: 1.09375rem;
      }

      .card__detail--organic {
        font-weight: 900;
        text-transform: uppercase;
        font-size: 1.1875rem;
        color: #276b35;
      }

      .card__detail--price {
        font-weight: 900;
        font-size: 1.1875rem;
      }

      .card__link:link,
      .card__link:visited {
        flex: 0 0 auto;
        background-color: #287a3b;
        color: white;
        font-size: 1rem;
        font-weight: 900;
        text-transform: uppercase;
        text-decoration: none;
        padding: 1.5625rem;
        min-height: 3.5rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s;
      }

      .card__link:hover,
      .card__link:active {
        background-color: #1f6530;
      }

      .card__link span {
        transform: skewX(20deg);
      }

      .card:hover {
        transform: skewX(-20deg) scale(1.025);
        box-shadow: 0 1.875rem 5rem 1.25rem rgba(0, 0, 0, 0.15);
      }

      .emoji-left {
        font-size: 1.25rem;
        margin-right: 0.625rem;
      }

      .emoji-right {
        font-size: 1.25rem;
        margin-left: 0.625rem;
      }

      .not-organic {
        display: none;
      }

      .card__link:focus-visible {
        position: relative;
        z-index: 1;
        outline: 0.1875rem solid #173f24;
        outline-offset: 0.1875rem;
      }

      @media (max-width: 56.25rem) {
        body {
          padding: 2.5rem 1.5rem 4rem;
        }

        .card,
        .card:hover {
          transform: none;
        }

        .card__emoji,
        .card__title,
        .card__detail,
        .card__link span {
          transform: none;
        }

        .card__emoji {
          letter-spacing: -1.5rem;
          padding-right: 2.25rem;
        }

        .card__title-box {
          padding: 0 1.25rem;
        }

        .card__details {
          flex-wrap: wrap;
        }

        .card__detail {
          padding: 0.75rem;
        }
      }

      @media (max-width: 40rem) {
        body {
          padding: 1.5rem 1rem 3rem;
        }

        h1 {
          font-size: 2.5rem;
        }

        .cards-container {
          margin-top: 3rem;
        }

        .card {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          margin-bottom: 1.5rem;
        }

        .card__emoji {
          grid-column: 1 / -1;
          padding: 0.625rem 1rem 0;
          font-size: 2.5rem;
          letter-spacing: 0.25rem;
          line-height: 1.3;
        }

        .card__title-box {
          min-height: 3.75rem;
          padding: 0.5rem 0.75rem;
        }

        .card__title {
          font-size: 1.5rem;
        }

        .card__details {
          grid-column: 1;
          gap: 0;
          padding: 0.25rem 0.5rem 0.5rem;
        }

        .card__detail-box {
          border: 0;
        }

        .card__detail {
          font-size: 0.875rem;
          padding: 0.25rem;
          overflow-wrap: anywhere;
        }

        .card__detail--organic,
        .card__detail--price {
          font-size: 0.9375rem;
        }

        .card__link:link,
        .card__link:visited {
          grid-column: 2;
          grid-row: 2 / 4;
          padding: 0.75rem;
          min-width: 3.5rem;
          font-size: 0.875rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        .card:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🌽 Node Farm 🥦</h1>

      <div class="cards-container">{%PRODUCTCARD%}</div>
    </div>
  </body>
</html>
